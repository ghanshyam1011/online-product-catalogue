<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Item form')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<main>
    <h1 id="form-title" th:text="${formTitle}"></h1>
    <form th:action="@{${formAction}}" th:object="${item}" method="post" id="item-form">
        <p>
            <label for="name">Name</label>
            <input type="text" th:field="*{name}">
            <span class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
        </p>
        <p>
            <label for="category">Category</label>
            <input type="text" th:field="*{category}">
            <span class="error" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></span>
        </p>
        <p>
            <label for="price">Price</label>
            <input type="number" step="0.01" th:field="*{price}">
            <span class="error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></span>
        </p>
        <p>
            <label for="quantity">Quantity</label>
            <input type="number" th:field="*{quantity}">
            <span class="error" th:if="${#fields.hasErrors('quantity')}" th:errors="*{quantity}"></span>
        </p>
        <p>
            <label for="lowStockThreshold">Low-stock threshold (default 5)</label>
            <input type="number" th:field="*{lowStockThreshold}">
            <span class="error" th:if="${#fields.hasErrors('lowStockThreshold')}" th:errors="*{lowStockThreshold}"></span>
        </p>
        <button type="submit" id="save-button">Save</button>
        <a th:href="@{/items}">Cancel</a>
    </form>
</main>
</body>
</html>
