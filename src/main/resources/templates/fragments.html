<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">Page</title>
    <style>
        :root { --bg:#f3f4f6; --card:#fff; --ink:#1f2937; --muted:#6b7280; --brand:#2563eb; --brand-dark:#1d4ed8; --line:#e5e7eb; }
        * { box-sizing: border-box; }
        body { font-family: system-ui, "Segoe UI", Arial, sans-serif; margin: 0; color: var(--ink); background: var(--bg); line-height: 1.5; }
        main { max-width: 960px; margin: 24px auto; padding: 24px; background: var(--card); border-radius: 10px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
        h1 { margin-top: 0; font-size: 1.6rem; }
        a { color: var(--brand); }
        .nav { display: flex; gap: 20px; align-items: center; padding: 12px 24px; background: #111827; color: #fff; }
        .nav a { color: #e5e7eb; text-decoration: none; font-weight: 500; }
        .nav a:hover { color: #fff; }
        .nav .spacer { flex: 1; }
        .nav #current-user { color: #9ca3af; font-size: .9rem; }
        .nav form { margin: 0; }
        .nav button { background: transparent; color: #e5e7eb; border: 1px solid #4b5563; }
        .nav button:hover { background: #374151; }
        table { border-collapse: collapse; width: 100%; margin-top: 12px; }
        th { text-align: left; padding: 10px 8px; background: #f9fafb; border-bottom: 2px solid var(--line); font-size: .85rem; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); }
        td { padding: 10px 8px; border-bottom: 1px solid var(--line); }
        tbody tr:hover { background: #f9fafb; }
        .badge { padding: 2px 10px; border-radius: 999px; font-size: .8rem; font-weight: 600; color: #fff; white-space: nowrap; }
        .badge.green, .alert.green { background: #2e7d32; }
        .badge.amber, .alert.amber { background: #b26a00; }
        .badge.red, .alert.red { background: #c62828; }
        .alert { padding: 10px 14px; border-radius: 8px; margin: 12px 0; color: #fff; }
        .filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 16px 0; }
        input[type=text], input[type=password], input[type=number], select { padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 1rem; background: #fff; }
        input:focus, select:focus { outline: 2px solid #93c5fd; border-color: var(--brand); }
        button { padding: 8px 16px; border: 0; border-radius: 6px; background: var(--brand); color: #fff; font-size: 1rem; cursor: pointer; }
        button:hover { background: var(--brand-dark); }
        .error, [style*="color:red"] { color: #c62828; font-size: .9rem; }
        label { display: block; margin-bottom: 4px; font-weight: 500; }
        form p { margin: 14px 0; }
        .auth { max-width: 400px; margin-top: 64px; }
        .auth h1 { text-align: center; }
        .auth h2 { margin: 0 0 16px; font-size: 1.2rem; text-align: center; color: var(--muted); font-weight: 500; }
        .auth input[type=text], .auth input[type=password] { width: 100%; }
        .auth button { width: 100%; }
        .msg { padding: 10px 14px; border-radius: 8px; margin: 12px 0; font-size: .95rem; }
        .msg.ok { background: #dcfce7; color: #166534; }
        .msg.bad { background: #fee2e2; color: #991b1b; }
        .center { text-align: center; }
        .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin-top: 20px; }
        .tile { display: block; padding: 18px; border: 1px solid var(--line); border-radius: 10px; text-decoration: none; color: var(--ink); background: #f9fafb; }
        .tile:hover { border-color: var(--brand); background: #eff6ff; }
        .tile strong { display: block; color: var(--brand); margin-bottom: 4px; }
        .tile span { color: var(--muted); font-size: .9rem; }
    </style>
</head>
<body>
<nav th:fragment="nav" class="nav">
    <a th:href="@{/}" id="nav-home">Home</a>
    <a th:href="@{/items}" id="nav-catalogue">Catalogue</a>
    <a th:if="${isAdmin}" th:href="@{/admin/items/new}" id="nav-add-item">Add item</a>
    <a th:if="${isAdmin}" th:href="@{/admin/alerts}" id="nav-alerts">Stock alerts</a>
    <span class="spacer"></span>
    <span id="current-user" th:text="${currentUser}"></span>
    <form th:action="@{/logout}" method="post">
        <button type="submit" id="logout-button">Log out</button>
    </form>
</nav>
</body>
</html>
