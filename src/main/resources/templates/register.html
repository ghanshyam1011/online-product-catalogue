<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Register')}"></head>
<body>
<main class="auth">
    <h1>Online Product Catalogue</h1>
    <h2>Create an account</h2>
    <form th:action="@{/register}" th:object="${form}" method="post" id="register-form">
        <p>
            <label for="name">Name</label>
            <input type="text" th:field="*{name}">
            <span class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
        </p>
        <p>
            <label for="email">Email</label>
            <input type="text" th:field="*{email}">
            <span class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
        </p>
        <p>
            <label for="password">Password</label>
            <input type="password" th:field="*{password}">
            <span class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
        </p>
        <button type="submit" id="register-button">Register</button>
    </form>
    <p class="center"><a th:href="@{/login}" id="back-to-login">Back to login</a></p>
</main>
</body>
</html>
