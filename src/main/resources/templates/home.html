<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Home')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<main>
    <h1>Online Product Catalogue</h1>
    <p>Welcome, <strong th:text="${email}"></strong></p>
    <div class="tiles">
        <a th:href="@{/items}" id="browse-link" class="tile">
            <strong>Browse the catalogue</strong>
            <span>Search products and check stock levels</span>
        </a>
        <a th:if="${isAdmin}" th:href="@{/admin}" id="admin-link" class="tile">
            <strong>Admin area</strong>
            <span>Add items, update stock, see alerts</span>
        </a>
    </div>
</main>
</body>
</html>
